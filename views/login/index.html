<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Evolua+ | Login
  </title>

  <!--
    Como style.css está na mesma pasta
    que este index.html, utilizamos apenas:
  -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

</head>


<body>

  <main class="login-container">

    <section class="login-box">


      <!-- ==================================================
           LOGO
      =================================================== -->

      <div class="logo">

        <div class="logo-icon">

          <i class="fa-solid fa-chart-line"></i>

        </div>


        <div class="logo-text">

          <h1>
            Evolua<span>+</span>
          </h1>

          <p>
            Portal de Gestão de Carreira
          </p>

        </div>

      </div>



      <!-- ==================================================
           FORMULÁRIO
      =================================================== -->

      <div class="login-form">

        <div class="login-header">

          <h2>
            Bem-vindo!
          </h2>

          <p>
            Entre com seus dados para acessar a plataforma.
          </p>

        </div>


        <form id="loginForm">


          <!-- USUÁRIO -->

          <div class="input-group">

            <label for="usuario">

              Usuário

            </label>


            <div class="input-container">

              <i class="fa-regular fa-user"></i>

              <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Digite seu usuário"
                autocomplete="username"
                required
              >

            </div>

          </div>



          <!-- SENHA -->

          <div class="input-group">

            <label for="senha">

              Senha

            </label>


            <div class="input-container">

              <i class="fa-solid fa-lock"></i>


              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
              >


              <button
                type="button"
                class="password-button"
                id="passwordButton"
                title="Mostrar senha"
              >

                <i
                  class="fa-regular fa-eye"
                  id="passwordIcon"
                ></i>

              </button>

            </div>

          </div>



          <!-- ==================================================
               MENSAGEM
          =================================================== -->

          <div
            class="login-message"
            id="loginMessage"
          ></div>



          <!-- ==================================================
               BOTÃO ENTRAR
          =================================================== -->

          <button
            type="submit"
            class="login-button"
            id="loginButton"
          >

            Entrar

          </button>

        </form>

      </div>


      <!-- ==================================================
           RODAPÉ DO CARD
      =================================================== -->

      <div class="login-footer">

        <i class="fa-solid fa-shield-halved"></i>

        <span>
          Acesso exclusivo para colaboradores cadastrados.
        </span>

      </div>

    </section>

  </main>


  <!-- JavaScript -->
  <script src="app.js"></script>

</body>

</html>
