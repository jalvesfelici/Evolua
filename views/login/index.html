<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Evolua+ | Login</title>

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-brand">

                <div class="brand-icon">
                    <i class="fa-solid fa-chart-line"></i>
                </div>

                <div>
                    <h1>
                        Evolua+
                    </h1>

                    <span>
                        Portal de Carreiras
                    </span>
                </div>

            </div>

            <div class="login-header">

                <p class="eyebrow">
                    Acesso ao portal
                </p>

                <h2>
                    Bem-vindo!
                </h2>

                <p>
                    Entre com seus dados para acessar sua área no Evolua+.
                </p>

            </div>

            <form
                id="loginForm"
                novalidate
            >

                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <div class="input-container">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            spellcheck="false"
                            required
                        >

                    </div>

                </div>

                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="input-container">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-button"
                            id="passwordButton"
                            title="Mostrar senha"
                            aria-label="Mostrar senha"
                        >

                            <i
                                class="fa-regular fa-eye"
                                id="passwordIcon"
                            ></i>

                        </button>

                    </div>

                </div>

                <div
                    class="login-message"
                    id="loginMessage"
                    role="alert"
                ></div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    <span>
                        Entrar
                    </span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>

            <div class="login-footer">

                <i class="fa-solid fa-shield-halved"></i>

                <span>
                    Acesso exclusivo para usuários cadastrados.
                </span>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
